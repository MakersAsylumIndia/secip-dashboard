<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SECIP 2027</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23FF6A13' stroke='%231B1035' stroke-width='6'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Palette: deep ink for text and outlines, brand orange, and violet, pink, yellow and mint accents.
   Text on a colour is always ink or white at 4.5:1 or better; orange is never used for small text. */
:root{--ink:#1B1035;--o:#FF6A13;--ot:#B93E06;--o2:#FFE1CC;--o3:#FFF3E8;--v:#6D3BF5;--v2:#ECE5FF;--pk:#FF7DB0;--pk2:#FFE0EC;--y:#FFD43B;--y2:#FFF4C2;--g:#0B7A5E;--g2:#D4F5E9;--mint:#2CCB9F;--red:#B3261E;--bg:#FFF9F2;--soft:#E4DDF5;--line:#1B1035;--t:#1B1035;--m:#5B5370;--sh:4px 4px 0 var(--ink)}
*{box-sizing:border-box}
body{margin:0;font-family:"Bricolage Grotesque",system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg) radial-gradient(var(--o2) 1.3px,transparent 1.3px) 0 0/22px 22px;color:var(--t);line-height:1.45}
a{color:inherit}
:focus-visible{outline:3px solid var(--v);outline-offset:2px}
button{font:inherit}
[hidden]{display:none!important}
/* Sign-in */
.sitefoot{text-align:center;font-size:12px;color:var(--m);padding:14px 16px}
.sitefoot a{color:var(--ot);font-weight:600}
.signin{min-height:calc(100vh - 48px);display:grid;place-items:center;padding:24px}
.signin .box{background:#fff;border:2px solid var(--ink);border-radius:24px;padding:36px;max-width:420px;width:100%;box-shadow:8px 8px 0 var(--v)}
.signin h1{font-size:44px;margin:0 0 10px;font-weight:800;letter-spacing:-.02em;display:inline-block;background:linear-gradient(transparent 58%,var(--y) 58%);padding:0 4px}
.signin p{color:var(--m);margin:0 0 22px}
.signin label{display:block;font-weight:600;margin-bottom:6px}
.signin input{width:100%;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;font:inherit;font-size:16px}
.signin .msg{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--y2);border:1.5px solid var(--ink)}
.btn{display:inline-block;background:var(--o);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.wide{width:100%;margin-top:14px;padding:13px;font-size:16px}
.btn.quiet{background:none;color:var(--v);padding:6px 8px;border:0;box-shadow:none}
/* Layout */
.app{display:flex;min-height:100vh}
nav{width:232px;flex-shrink:0;background:var(--ink);color:#fff;padding:24px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
nav .logo{font-weight:800;font-size:24px;color:var(--y);padding:0 10px;letter-spacing:-.01em}
nav .who{font-size:13px;color:#CFC8E8;padding:2px 10px 24px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:12px;margin:2px 0;cursor:pointer;font-weight:500;color:#fff}
nav button:hover{background:rgba(255,255,255,.14)}
nav button[aria-current="page"]{background:var(--y);color:var(--ink);font-weight:700}
nav .out{margin-top:auto;color:#CFC8E8;font-size:14px;padding:10px 12px;text-decoration:none}
nav .out:hover{color:#fff;text-decoration:underline}
nav .out+.out{margin-top:0}
nav .swap{color:var(--y);font-weight:600}
.note{background:var(--v2);border:1.5px solid var(--v);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:14px}
main{flex:1;padding:30px 34px;max-width:1320px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-size:46px;margin:0;line-height:1;font-weight:800;letter-spacing:-.02em}
.top .meta{color:var(--m);margin-top:8px}
.pill{display:inline-block;background:var(--pk);color:var(--ink);font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;margin-left:8px;vertical-align:middle;border:1.5px solid var(--ink)}
.topr{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.btn.join{font-size:16px;padding:12px 20px}
.count{background:var(--v);color:#fff;border:2px solid var(--ink);border-radius:18px;padding:12px 20px;text-align:center;min-width:130px;box-shadow:var(--sh);transform:rotate(-2deg);font-weight:600}
.count b{display:block;font-size:36px;line-height:1;color:var(--y)}
.grid{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:20px}
.card{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:20px;min-width:0;box-shadow:var(--sh)}
.card h2{margin:0 0 12px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px}
.card h2:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--o);border:2px solid var(--ink);flex-shrink:0}
.grid>.card:nth-child(4n+2) h2:before{background:var(--v)}.grid>.card:nth-child(4n+3) h2:before{background:var(--pk)}.grid>.card:nth-child(4n+4) h2:before{background:var(--mint)}
.card .card{box-shadow:none;border-width:1.5px;border-radius:16px}
.s2{grid-column:span 2}.s3{grid-column:1/-1}.r2{grid-row:span 2}
.brief{background:var(--y)}.brief p{margin:8px 0}.brief strong{background:linear-gradient(transparent 55%,#fff 55%);padding:0 2px}
.brief h2:before{background:#fff!important}
.sub{font-size:13px;color:var(--m)}
.tag{display:inline-block;background:var(--y2);border-radius:20px;padding:3px 11px;margin:3px 4px 3px 0;font-size:13px}
.tag:nth-of-type(4n+2){background:var(--v2)}.tag:nth-of-type(4n+3){background:var(--g2)}.tag:nth-of-type(4n+4){background:var(--pk2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer}
.chips button:hover{background:var(--y2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lnk{display:flex;flex-direction:column;gap:2px;padding:10px 12px;margin:8px 0;border-radius:12px;background:var(--o3);border:1.5px solid var(--ink);text-decoration:none;font-size:14px;transition:transform .08s}
.lnk:hover{background:var(--y);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}.lnk span:first-child{font-weight:700}.lnk span:last-child{color:var(--m);font-size:12px}.lnk:hover span:last-child{color:var(--ink)}.lnk span:last-child:empty{display:none}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1.5px dashed var(--soft)}
.row:last-child{border-bottom:0}
.row input[type=checkbox]{accent-color:var(--v);width:19px;height:19px;margin-top:2px;flex-shrink:0}
.when{margin-left:auto;font-size:12px;background:var(--v2);border-radius:20px;padding:2px 10px;white-space:nowrap}
.when.soon{background:var(--o);color:var(--ink);font-weight:700}
.doneby{color:var(--g);overflow:hidden;text-overflow:ellipsis}
.time{font-size:13px;color:var(--m);white-space:nowrap;min-width:88px}
.time .tz{font-size:12px;color:var(--v)}
#map{height:270px;border-radius:14px;background:var(--v2);border:1.5px solid var(--ink)}
.stats{display:flex;gap:10px;margin-top:10px}.stat{flex:1;background:var(--v2);border-radius:12px;padding:8px;text-align:center;font-size:12px}.stat b{display:block;font-size:24px;color:var(--v);font-weight:800}
.stats .stat:nth-child(2){background:var(--y2)}.stats .stat:nth-child(2) b{color:var(--ot)}.stats .stat:nth-child(3){background:var(--g2)}.stats .stat:nth-child(3) b{color:var(--g)}
.tl{display:flex;position:relative;margin-top:24px;overflow-x:auto;padding:4px 4px 6px}
.tl:before{content:"";position:absolute;top:12px;left:0;right:0;height:4px;border-radius:4px;background:var(--soft)}
.tl .bar{position:absolute;top:12px;left:0;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--o),var(--pk))}
.step{flex:1;min-width:92px;position:relative;padding-right:10px;font-size:12px}
.step .dot{width:19px;height:19px;border-radius:50%;background:#fff;border:2px solid var(--soft);position:relative;z-index:1}
.step.done .dot{background:var(--o);border-color:var(--ink)}.step.now .dot{background:var(--y);border-color:var(--ink);box-shadow:0 0 0 5px var(--y2)}
.step .d{color:var(--m);margin:8px 0 2px}.step b{display:block;font-size:13px}
.av{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);flex-shrink:0;background:var(--y);overflow:hidden}
.cards>:nth-child(4n+2) .av,.row:nth-child(4n+2) .av{background:var(--pk)}.cards>:nth-child(4n+3) .av,.row:nth-child(4n+3) .av{background:var(--mint)}.cards>:nth-child(4n+4) .av,.row:nth-child(4n+4) .av{background:var(--v2)}
.av img{width:100%;height:100%;object-fit:cover}
.person{display:flex;gap:12px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.mc{background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh)}
.mc .ph{height:160px;background:var(--v2);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:var(--v);border-bottom:2px solid var(--ink)}
.mc:nth-child(3n+2) .ph{background:var(--y2);color:var(--ot)}.mc:nth-child(3n+3) .ph{background:var(--g2);color:var(--g)}
.mc .ph img{width:100%;height:100%;object-fit:cover}
.mc .bd{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:6px}.mc h3{margin:0;font-size:17px}
.mc .ft{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.partners{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pl{height:76px;border:1.5px solid var(--soft);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:600;font-size:13px;color:var(--m);background:#fff;text-decoration:none}
a.pl:hover{border-color:var(--ink)}
.pl img{max-height:48px;max-width:100%;object-fit:contain}
input.search{width:100%;padding:10px 14px;border:2px solid var(--ink);border-radius:12px;font:inherit;font-size:15px;margin-bottom:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--m);font-weight:700;font-size:12px;padding:6px;text-transform:uppercase;letter-spacing:.04em}
td{padding:9px 6px;border-top:1.5px dashed var(--soft);vertical-align:top}
.wrapx{overflow-x:auto}
.st{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--v2);color:var(--ink)}
.st.Confirmed{background:var(--g2);color:var(--g)}.st.Pending{background:var(--y2);color:#7A4300}.st.Not.started,.st.Not{background:#EEEBF5;color:var(--m)}
.att{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--soft);margin-right:3px}.att.y{background:var(--mint);box-shadow:inset 0 0 0 1.5px var(--ink)}.att.n{background:#fff;box-shadow:inset 0 0 0 1.5px var(--red)}
.day h3{margin:20px 0 6px;font-size:16px;display:inline-block;background:var(--y2);border-radius:8px;padding:2px 10px}
.empty{color:var(--m);font-size:14px;padding:6px 0}
/* Assessments */
.st.Late{background:#FDE2E0;color:var(--red)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;align-items:start;margin-top:20px}
.ahead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.ahead h2{margin-bottom:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.checks{margin:10px 0 0;padding:0;list-style:none;font-size:14px}.checks li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--soft)}.checks li:last-child{border:0}
details.more{margin-top:12px;border-top:1.5px solid var(--soft);padding-top:8px}details.more summary{cursor:pointer;font-weight:700;color:var(--v)}
.md{font-size:14px}.md p{margin:.55em 0}.md ul{margin:.4em 0;padding-left:1.2em}.md h4{margin:.9em 0 .3em}.md a{color:var(--ot);font-weight:600;word-break:break-word}
/* Online lessons (Assessment 1A) */
.lchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lchip{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:#fff;border-radius:14px;padding:8px 12px;cursor:pointer;font-weight:700;text-align:left}
.lchip small{display:block;font-weight:400;color:var(--m)}.lchip[aria-pressed="true"]{background:var(--y)}.lchip .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:12px;flex-shrink:0}.lchip.done .tick{background:var(--mint)}
.part{margin-top:18px}.part .num{font-size:12px;font-weight:700;color:var(--v);text-transform:uppercase;letter-spacing:.05em}
.vid{position:relative;padding-top:56.25%;margin-top:12px;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--ink)}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.quiz .qq{margin:18px 0 0;padding:14px;border:1.5px solid var(--soft);border-radius:14px}.quiz .qq legend{font-weight:700;padding:0 4px;float:left;width:100%;margin-bottom:8px}
.quiz label.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:14px}.quiz label.opt:hover{background:var(--o3)}.quiz label.opt input{margin-top:3px}
.quiz .qq.wrong{border-color:var(--red);background:#FFF5F4}.quiz .qq.right{border-color:var(--g);background:#F2FCF8}.quiz .opt.is-correct{background:var(--g2);font-weight:700}
.quiz .flag{font-size:13px;font-weight:700;margin-top:6px}.quiz .wrong .flag{color:var(--red)}.quiz .right .flag{color:var(--g)}
.qres{margin-top:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--ink);background:var(--y2)}.qres.ok{background:var(--g2)}
.md table{border-collapse:collapse;width:100%;margin:.5em 0}.md th,.md td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--soft);vertical-align:top}.md th{border-bottom:2px solid var(--ink)}
.mm .why{font-size:13px;color:var(--g);margin-top:4px}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--m);text-align:center;padding:24px}

.pp{cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;border:2px solid var(--ink);background:#fff;border-radius:18px;padding:0;overflow:hidden;transition:transform .08s,box-shadow .08s}
.pp:hover{transform:translate(-2px,-2px);box-shadow:var(--sh)}
.pp .img{height:120px;background:var(--pk2);border-bottom:2px solid var(--ink)}
.cards>.pp:nth-child(3n+2) .img{background:var(--y2)}.cards>.pp:nth-child(3n+3) .img{background:var(--g2)}
.pp .img img{width:100%;height:100%;object-fit:cover;display:block}
.pp .bd{padding:12px 14px 14px}
.pp p{margin:4px 0 0;font-size:13px;color:var(--m);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ppbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.ppbar select,.ppbar textarea{font:inherit;font-size:14px;padding:9px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--t)}
.ppbar textarea{flex:1 1 100%;min-height:64px;resize:vertical}
dialog.ppd{max-width:760px;width:calc(100% - 32px);border:2px solid var(--ink);border-radius:22px;padding:26px;background:var(--bg);color:var(--t);box-shadow:8px 8px 0 var(--v)}
dialog.ppd::backdrop{background:rgba(27,16,53,.55)}
dialog.ppd h3{margin:16px 0 4px;font-size:15px}
@media(max-width:1000px){
 .app{flex-direction:column}
 nav{width:auto;height:auto;position:sticky;top:0;z-index:1000;flex-direction:row;align-items:center;gap:4px;padding:8px 10px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
 nav::-webkit-scrollbar{display:none}
 nav .who{display:none}nav .logo{padding:0 8px 0 4px;font-size:18px}
 nav>*{flex-shrink:0;white-space:nowrap}
 nav button{width:auto;padding:8px 10px;font-size:14px}nav .out{margin:0 0 0 auto}nav .out+.out{margin-left:0}
 main{padding:18px}
 .grid{grid-template-columns:1fr;gap:16px}.s2,.s3{grid-column:auto}.r2{grid-row:auto}
 .partners{grid-template-columns:repeat(2,1fr)}
 .top h1{font-size:34px}
 .card,.mc{box-shadow:3px 3px 0 var(--ink)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<div class="loading" id="loading">Loading your dashboard…</div>

<section class="signin" id="signin" hidden>
 <form class="box" id="signinForm">
  <h1>SECIP 2027</h1>
  <p>Sign in with the email address your university registered for you.</p>
  <label for="email">Email address</label>
  <input id="email" type="email" autocomplete="email" required placeholder="you@university.edu">
  <button class="btn wide" type="submit">Email me a sign-in link</button>
  <div class="msg" id="signinMsg" role="status" hidden></div>
 </form>
</section>

<div class="app" id="app" hidden>
 <nav id="nav" aria-label="Dashboard sections"></nav>
 <main id="main"></main>
</div>

<footer class="sitefoot">This site is powered by <a href="https://www.netlify.com" target="_blank" rel="noopener">Netlify</a> · <a href="https://github.com/MakersAsylumIndia/secip-dashboard" target="_blank" rel="noopener">Source on GitHub</a> · Licence: <a href="https://github.com/MakersAsylumIndia/secip-dashboard/blob/main/LICENSE" target="_blank" rel="noopener">Apache-2.0</a> · <a href="https://github.com/MakersAsylumIndia/secip-dashboard/blob/main/CODE_OF_CONDUCT.md" target="_blank" rel="noopener">Code of conduct</a></footer>

<script>
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? h(u) : '#';
const ini = n => String(n || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const lines = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
const todayISO = () => new Date().toLocaleDateString('en-CA');
const fmtDate = (d, o = { day: 'numeric', month: 'short' }) => d ? new Date(d.length === 10 ? d + 'T00:00' : d).toLocaleDateString('en-GB', o) : '';
const ist = d => new Date(d).toLocaleTimeString('en-GB', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit' });
const local = d => new Date(d).toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit' });
const sameZone = () => ['Asia/Kolkata', 'Asia/Calcutta'].includes(Intl.DateTimeFormat().resolvedOptions().timeZone);
const zoneCity = () => (Intl.DateTimeFormat().resolvedOptions().timeZone || 'your time').split('/').pop().replace(/_/g, ' ');
const dayShift = d => { const a = new Date(d).toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' }), b = new Date(d).toLocaleDateString('en-CA'); return a === b ? '' : b > a ? ' (+1 day)' : ' (−1 day)'; };
const timeCell = d => d ? `${h(ist(d))} IST${sameZone() ? '' : `<br><span class="tz">${h(local(d))} ${h(zoneCity())}${dayShift(d)}</span>`}` : '';
const tzNote = () => sameZone() ? 'Times are in India Standard Time.' : `Times are in India Standard Time, with ${h(zoneCity())} time underneath.`;
const timeLabel = a => a.start ? `${ist(a.start)} IST${sameZone() ? '' : ` · ${local(a.start)} your time`}` : '';
// The session that is on now, or the next one still to come today.
function nowNext(sessions) {
  const now = Date.now(), t = d => new Date(d).getTime();
  const on = sessions.find(a => a.start && t(a.start) <= now && now < (a.end ? t(a.end) : t(a.start) + 36e5));
  const a = on || sessions.find(x => x.start && t(x.start) > now);
  return a ? { a, on: !!on } : null;
}
// The Zoom link for the "Join the session" button: the session on now or next today, then the next
// programme day's, then any session's, then an Important link with "zoom" in its name.
function sessionZoom(D, C) {
  if (C.after) return '';

async function boot() {
  let r;
  // If the server is busy (everyone arriving at once), wait a moment and try again before giving up.
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt) await new Promise(ok => setTimeout(ok, 2500));
    try { r = await fetch('/api/me' + (store.get('view') === 'student' ? '?view=student' : ''), { credentials: 'same-origin' }); } catch { r = null; }
    if (r && r.status < 500) break;
  }
  $('#loading').hidden = true;
  if (!r || r.status === 401) {
    $('#signin').hidden = false;
    if (params.get('signin') === 'expired') { const m = $('#signinMsg'); m.hidden = false; m.textContent = 'That sign-in link has expired or was already replaced. Enter your email to get a new one.'; }
    history.replaceState(null, '', '/');
    return;
  }
  if (!r.ok) { document.body.innerHTML = '<div class="loading">The dashboard could not load its data. Refresh in a minute, or contact the SECIP team if it keeps happening.<br><br><button class="btn" type="button" onclick="location.reload()">Try again</button></div>'; return; }
  const D = await r.json();
  $('#app').hidden = false;
  D.role === 'sc' ? committeeApp(D) : studentApp(D);
}

// ---------- programme calendar from the agenda ----------
function calendar(agenda) {
  const dates = [...new Set(agenda.map(a => a.date))].sort();
  const t = todayISO();
  let idx = dates.indexOf(t);
  const before = dates.length && t < dates[0], after = dates.length && t > dates[dates.length - 1];
  const gap = idx < 0 && !before && !after; // a weekend inside the programme: show the next day, and say so
  if (gap) idx = dates.findIndex(d => d > t);
  const cur = before ? 0 : after ? dates.length - 1 : Math.max(idx, 0);
  const phaseOf = d => {
    const counts = {};
    agenda.filter(a => a.date === d && a.phase && !['Orientation', 'Reflection'].includes(a.phase)).forEach(a => counts[a.phase] = (counts[a.phase] || 0) + 1);
    return Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || 'Orientation';
  };
  const headline = d => agenda.filter(a => a.date === d && !/opening brief|break|reflection/i.test(a.session))[0]?.session || '';
  const daysToGo = before ? Math.ceil((new Date(dates[0] + 'T00:00') - new Date(t + 'T00:00')) / 864e5) : 0;
  return { dates, cur, before, after, gap, live: !before && !after && !gap, phaseOf, headline, daysToGo, today: dates[cur], sessions: d => agenda.filter(a => a.date === d) };
}

function timeline(C) {
  if (!C.dates.length) return '<p class="empty">The agenda will appear here once it is added in Airtable.</p>';
  const pos = C.before ? -1 : C.after ? C.dates.length : C.cur;
  const w = pos < 0 ? 0 : Math.min(100, pos / Math.max(C.dates.length - 1, 1) * 100);
  return `<div class="tl"><div class="bar" style="width:${w}%"></div>${C.dates.map((d, i) =>
    `<div class="step ${i < pos ? 'done' : i === pos ? 'now' : ''}"><div class="dot"></div><div class="d">Day ${i + 1} · ${fmtDate(d)}</div><b>${h(C.phaseOf(d))}</b>${h(C.headline(d))}</div>`).join('')}</div>`;
}

const STOP = new Set('the a an and or of to in for on with by at from is are be how might we can our their they them this that these those as it its into without who what which help people more less young local'.split(' '));
const words = t => String(t || '').toLowerCase().match(/[a-z]{4,}/g)?.filter(w => !STOP.has(w)).map(w => w.replace(/(ing|ers|ies|es|s)$/, '')) || [];

function rankPast(P, idea, sdgs) {
  const q = new Set(words(idea));
  return P.map(p => { const w = new Set(words(p.name + ' ' + p.problem + ' ' + p.solution));
      let shared = 0; q.forEach(x => { if (w.has(x)) shared++; });
      const sdgHit = p.sdgNums.filter(n => sdgs.includes(n)).length;
      return { p, score: shared * 2 + sdgHit * 3 + (q.size ? 0 : Math.random() * .01), shared, sdgHit }; })
    .filter(x => x.score > 0.5).sort((a, b) => b.score - a.score);
}

// Suggests students outside your own team who share your SDG interests,
// nudging towards other universities and countries. Uses only data already in the directory.
function matchmaker(D, me) {
  const mine = new Set(me.sdg);
  return D.students.filter(s => s.name !== me.name && !(me.team && s.team === me.team))
    .map(s => { const shared = s.sdg.filter(x => mine.has(x));
      return { s, shared, score: shared.length * 3 + (s.uni && s.uni !== me.uni ? 1 : 0) + (s.country && s.country !== me.country ? 1 : 0) }; })
    .filter(x => x.shared.length)
    .sort((a, b) => b.score - a.score || a.s.name.localeCompare(b.s.name));
}

// ---------- assessments ----------
// Airtable rich text arrives as Markdown. This renders the parts the assessment notes use (bold,
// links, lists, headings, pipe tables) and escapes everything else, so no HTML from Airtable runs.
function md(src) {
  const ESC = [], TOK = [];
  const tok = html => { TOK.push(html); return `\u0002${TOK.length - 1}\u0003`; };
  let text = String(src || '').replace(/\\([\\`*_{}\[\]()#+\-.!|<>~])/g, (m, c) => { ESC.push(c); return `\u0000${ESC.length - 1}\u0001`; });
  const restore = t => t.replace(/\u0002(\d+)\u0003/g, (m, i) => TOK[i]).replace(/\u0000(\d+)\u0001/g, (m, i) => h(ESC[i]));
  const bold = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*\*/g, '');
  const a = (u, label) => tok(`<a href="${h(u.trim())}" target="_blank" rel="noopener">${label}</a>`);
  const inline = t => {
    t = h(t);
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\s*\)/g, (m, label, u) => a(u.replace(/&amp;/g, '&'), bold(label.trim())));
    t = t.replace(/&lt;(https?:\/\/[^\s]+?)&gt;/g, (m, u) => a(u.replace(/&amp;/g, '&'), u));
    t = t.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, (m, pre, u) => pre + a(u.replace(/&amp;/g, '&'), u));
    return restore(bold(t));
  };
  const cells = l => { let x = l.trim(), head = false; if (/^\*\*.*\*\*$/.test(x)) { head = true; x = x.slice(2, -2); } return { head, cells: x.split('|').map(c => c.trim()) }; };
  const out = [], L = text.split('\n');
  let para = [], list = [];
  const flush = () => { if (para.length) out.push(`<p>${para.map(inline).join('<br>')}</p>`); if (list.length) out.push(`<ul>${list.map(x => `<li>${inline(x)}</li>`).join('')}</ul>`); para = []; list = []; };
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (!l.trim()) { flush(); continue; }
    if (l.includes('|') && L[i + 1] && L[i + 1].includes('|')) {
      flush(); const rows = [];
      while (i < L.length && L[i].includes('|')) rows.push(cells(L[i++]));
      i--;
      out.push(`<table>${rows.map(r => `<tr>${r.cells.map(c => r.head ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table>`);
      continue;
    }
    const li = l.match(/^\s*[-*]\s+(.*)/), hd = l.match(/^\s*#{1,6}\s+(.*)/);
    if (li) { if (para.length) { const keep = list; list = []; flush(); list = keep; } list.push(li[1]); continue; }
    if (hd) { flush(); out.push(`<h4>${inline(hd[1])}</h4>`); continue; }
    if (list.length) flush();
    para.push(l.trim());
  }
  flush();
  return out.join('');
}

const ytId = u => (String(u).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/)|youtu\.be\/)([\w-]{11})/) || [])[1];
const isMonash = me => /monash/i.test(me.uni || '');

const lessonsDone = D => new Set([...((D.progress && D.progress.lessons) || []), ...(D.lessons.lessons || []).map(L => L.n).filter(n => store.get('quizpass:' + n) === '1')]);

function quizHTML(D, L, state) {
  const qs = (D.quiz || {})[L.n] || [], done = lessonsDone(D).has(L.n), r = state[L.n] || {};
  if (!qs.length) return `<div class="card quiz"><h2>Lesson ${L.n} quiz</h2><p class="empty">The quiz for this lesson will appear here soon.</p></div>`;

    ${done && !r.result ? '<div class="qres ok">You have completed this lesson. You can take the quiz again to revise if you like.</div>' : ''}
    <form id="qform">${qs.map((q, i) => { const st = r.result ? (wrong.has(q.id) ? 'wrong' : 'right') : '';
      return `<fieldset class="qq ${st}"><legend>${i + 1}. ${h(q.q)}</legend>${q.options.map(o => `<label class="opt ${review && review[q.id] && review[q.id].correct === o.k ? 'is-correct' : ''}"><input type="radio" name="${h(q.id)}" value="${o.k}" ${(r.answers || {})[q.id] === o.k ? 'checked' : ''}><span>${h(o.t)}</span></label>`).join('')}

function lessonsPage(D, me) {

  const a1 = (D.assessments || []).find(a => a.kind === 'lessons');
  const top = () => { const done = lessonsDone(D); return `<div class="card"><h2>Assessment 1A: Online lessons</h2>

    ...((D.lessons && (D.lessons.lessons || []).length) ? [lessonsPage(D, me)] : []),
    { id: 'directory', label: 'Student directory', render: () => `<div class="card"><h2>Student directory</h2><input class="search" id="q" type="search" placeholder="Search by name, university, country or goal" aria-label="Search students"><div class="cards" id="dir"></div></div>`,
      after: () => { const draw = () => { const q = ($('#q').value || '').toLowerCase(); const list = D.students.filter(s => [s.name, s.uni, s.country, s.team, ...s.sdg].join(' ').toLowerCase().includes(q));
        $('#dir').innerHTML = list.length ? list.map(s => `<div class="card person"><div class="av">${h(ini(s.name))}</div><div><b>${h(s.name)}</b><div class="sub">${h(s.uni)}</div><div class="sub">${h([s.country, s.team].filter(Boolean).join(', '))}</div>${s.sdg.slice(0, 2).map(t => `<span class="tag">${h(t)}</span>`).join('')}</div></div>`).join('') : '<p class="empty">No students match that search.</p>'; };
        $('#q').oninput = draw; draw(); } },
    { id: 'matchmaker', label: 'Matchmaker', render: () => `<div class="card"><h2>Matchmaker</h2>
      <p class="sub" style="margin:-4px 0 14px">People outside your team who share your goals, with students from other universities and countries first. Say hello in a breakout room or on the Discord forum.</p>
      ${me.sdg.length ? `<div class="chips" role="group" aria-label="Filter by goal" style="margin-bottom:14px"><button class="chip" type="button" data-g="" aria-pressed="true">All my goals</button>${me.sdg.map(t => `<button class="chip" type="button" data-g="${h(t)}" aria-pressed="false">${h(t)}</button>`).join('')}</div>` : ''}
      <div class="cards" id="mml"></div></div>`,
      after: () => { const draw = gl => { const list = gl ? MM.filter(x => x.shared.includes(gl)) : MM;
          $('#mml').innerHTML = list.length ? list.map(x => matchCard(x, me)).join('') : matchEmpty(me); };
        document.querySelectorAll('.chip').forEach(c => c.onclick = () => { document.querySelectorAll('.chip').forEach(o => o.setAttribute('aria-pressed', o === c ? 'true' : 'false')); draw(c.dataset.g); });
        draw(''); } },
    pastPage(sdgOf(me.sdg)),
    { id: 'mentors', label: 'Mentor gallery', render: () => g.html, after: g.wire },
    { id: 'agenda', label: 'Agenda', render: () => `<div class="card"><h2>Full agenda</h2><p class="sub">${tzNote()}</p>${agendaHTML(C, 'studentTodo')}</div>` },
    { id: 'contacts', label: 'Committee contacts', render: () => `<div class="card"><h2>Steering Committee contacts</h2>
      <p class="sub" style="margin:-4px 0 14px">Not sure who to ask? Start with the representative from your own university.</p>
      ${contacts.length ? `<div class="cards">${contacts.map(c => `<div class="card person"><div class="av">${h(ini(c.name))}</div><div><b>${h(c.name)}</b><div class="sub">${h(c.uni)}</div>
        ${c.rep ? `<span class="tag">${c.uni === me.uni ? 'Your university’s representative' : 'University representative'}</span>` : ''}
        <div class="sub" style="margin-top:6px"><a href="mailto:${h(c.email)}">${h(c.email)}</a></div></div></div>`).join('')}</div>` : '<p class="empty">Committee contacts will appear here soon.</p>'}</div>` },
  ], me.uni);
}

// ---------- steering committee ----------
function committeeApp(D) {
  const me = D.me, C = calendar(D.agenda), today = todayISO();
  const tkey = t => 'sc:' + t.id;
  // A task is done for your university when the university is in the task's "Done by" list in Airtable,
  // so everyone at your university, on any device, sees the same ticks. A tick that could not be
  // shared (older ticks, or a read-only Airtable token) is kept on this device.
  const orgs = [...new Set(D.committee.map(c => c.uni.trim()).filter(Boolean))];
  const local = t => store.get(tkey(t)) === '1';
  const done = t => (!!me.uni && t.doneBy.includes(me.uni)) || local(t);
  const nextTask = () => D.tasks.find(t => t.due && t.due >= today && !done(t)) || D.tasks.find(t => !done(t));
  let tickNote = '';
  const checklist = () => `<div class="card s2 r2" id="checklist"><h2>Lead-up checklist</h2>${D.tasks.length ? D.tasks.map(t => { const dd = t.due ? (new Date(t.due + 'T00:00') - new Date(today + 'T00:00')) / 864e5 : null;
        return `<label class="row"><input type="checkbox" data-t="${h(t.id)}" ${done(t) ? 'checked' : ''}><div><b>${h(t.task)}</b>${t.notes ? `<div class="sub">${h(t.notes)}</div>` : ''}
          ${t.doneBy.length ? `<div class="sub doneby" title="${h(t.doneBy.join(', '))}">Done by ${t.doneBy.length} of ${orgs.length}: ${h(t.doneBy.join(', '))}</div>` : ''}</div>${t.due ? `<span class="when ${dd !== null && dd >= 0 && dd < 10 && !done(t) ? 'soon' : ''}">${fmtDate(t.due)}</span>` : ''}</label>`; }).join('') : '<p class="empty">No tasks yet.</p>'}
        <p class="sub" style="margin-top:10px" role="status">${tickNote || (me.uni ? `Ticks are shared: they mark a task as done for ${h(me.uni)} and show for the whole committee.` : 'Ticks are saved on this device.')}</p></div>`;
  const wireChecklist = () => document.querySelectorAll('#checklist [data-t]').forEach(c => c.onchange = async () => {
    const t = D.tasks.find(x => x.id === c.dataset.t), want = c.checked; c.disabled = true;
    let r = null; try { r = await fetch('/api/task', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: t.id, done: want }) }); } catch {}
    if (r && r.ok) { t.doneBy = (await r.json()).doneBy || []; store.set(tkey(t), '0'); tickNote = ''; }
    else if (r && r.status === 401) { location.reload(); return; }
    else if (r && r.status < 500) { store.set(tkey(t), want ? '1' : '0'); tickNote = 'This tick is saved on this device only, because sharing ticks is not switched on yet.'; }
    else tickNote = 'That tick could not be saved. Check your connection and try again.';
    $('#checklist').outerHTML = checklist(); wireChecklist(); $('#brief').outerHTML = brief();
  });
  const header = `<div class="top"><div><h1>Steering committee</h1><div class="meta">${h(me.name)}${me.uni ? ', ' + h(me.uni) : ''}${me.teams.length ? `<span class="pill">${h(me.teams.join(', '))}</span>` : ''}</div></div>
    <div class="topr">${joinSession(D, C)}<div class="count"><b>${C.before ? C.daysToGo : C.after ? '✓' : C.cur + 1}</b>${C.before ? 'days to launch' : C.after ? 'complete' : C.gap ? 'next programme day' : 'programme day'}</div></div></div>`;
  const scToday = C.live ? C.sessions(C.today).filter(a => a.scTodo) : [];
  const brief = () => { const next = nextTask(); return `<div class="card brief" id="brief"><h2>This week</h2>
        ${C.before ? `<p><strong>${C.daysToGo} day${C.daysToGo === 1 ? '' : 's'}</strong> until SECIP starts.</p>` : C.after ? '<p>The programme has finished. Thank you.</p>' : C.gap ? `<p><strong>No sessions today.</strong> Day ${C.cur + 1} is on ${fmtDate(C.today, { weekday: 'long', day: 'numeric', month: 'short' })}: ${h(C.headline(C.today))}.</p>` : `<p>Today is <strong>Day ${C.cur + 1}</strong>: ${h(C.headline(C.today))}.</p>`}
        ${C.live ? nowNextHTML(C.sessions(C.today)) : ''}
        ${next ? `<p>Next task: <strong>${h(next.task)}</strong>${next.due ? `, due ${fmtDate(next.due)}` : ''}.</p>` : ''}
        <p>${me.uni ? h(me.uni) + ' has done ' : ''}${D.tasks.filter(done).length} of ${D.tasks.length} lead-up tasks${me.uni ? '' : ' done'}.</p>
        ${scToday.length ? `<p>Your role today: ${scToday.map(a => `<br>• <b>${h(ist(a.start))}</b> ${h(lines(a.scTodo)[0])}`).join('')}</p>` : ''}</div>`; };
  // Attendance is judged over programme days that are over (today is still in progress).
  const elapsed = () => C.after ? C.dates.length : C.dates.filter(d => d < today).length;
  const attended = (s, el) => s.att.slice(0, el).filter(Boolean).length, missed = (s, el) => el - attended(s, el);
  const g = mentorGallery(D, true);
  const conf = D.mentors.filter(m => m.confirmed).length;

  shell(D, [
    { id: 'home', label: 'Home', render: () => `${header}<div class="grid">
      ${brief()}
${checklist()}
      <div class="card"><h2>Important links</h2>${linksHTML(D.links)}</div>
      <div class="card s3"><h2>Road to launch</h2>${(() => { const ms = D.tasks.filter(t => t.milestone && t.due); if (!ms.length) return '<p class="empty">Mark tasks as milestones in Airtable to show them here.</p>';
        const all = [...ms, ...(ms.some(m => m.due === C.dates[0]) ? [] : [{ task: 'Programme starts', due: C.dates[0] }])].filter(m => m.due).sort((a, b) => a.due < b.due ? -1 : 1); const pos = all.findIndex(m => m.due > today); const p = pos < 0 ? all.length : pos;
        return `<div class="tl"><div class="bar" style="width:${Math.max(0, (p - 1) / Math.max(all.length - 1, 1) * 100)}%"></div>${all.map((m, i) => `<div class="step ${i < p ? 'done' : i === p ? 'now' : ''}"><div class="dot"></div><div class="d">${fmtDate(m.due)}</div><b>${h(m.task)}</b></div>`).join('')}</div>`; })()}</div>
      <div class="card s3"><h2>Programme partners</h2>${partnersHTML(D.partners)}</div></div>`,
      after: wireChecklist },
    { id: 'universities', label: 'University status', render: () => `${header}<div class="card"><h2>Participation by university</h2><div class="wrapx"><table><thead><tr><th>University</th><th>Committee contact</th><th>Participation</th><th>Student list</th><th>Mentor list</th><th>Checklist</th></tr></thead><tbody>
      ${D.universityStatus.map(u => `<tr><td><b>${h(u.name)}</b></td><td>${h(u.rep)}</td>${[u.participation, u.studentList, u.mentorList].map(s => `<td><span class="st ${h(s)}">${h(s)}</span></td>`).join('')}<td>${D.tasks.filter(t => t.doneBy.includes(u.name)).length} of ${D.tasks.length}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card" style="margin-top:18px"><h2>Where students are coming from</h2><div id="map"></div>${mapStats(D)}</div>`,
      after: () => { drawMap(D, $('#map')); } },
    { id: 'mentors', label: 'Mentors', render: () => `<div class="grid" style="margin-bottom:18px">
      <div class="card"><h2>Mentor summary</h2><div class="stats" style="margin-top:0"><div class="stat"><b>${D.mentors.length}</b>Listed</div><div class="stat"><b>${conf}</b>Confirmed</div><div class="stat"><b>${D.mentors.length - conf}</b>To confirm</div></div>
        <h2 style="margin-top:18px">Guide for mentors</h2>${(() => { const g = D.links.filter(l => /mentor/i.test(l.name)); return g.length ? linksHTML(g) + '<p class="sub" style="margin-top:8px">Committee members can edit this document directly. Share it when you invite your mentors.</p>' : '<p class="empty">Add the mentor guide to Important Links in Airtable (with "mentor" in its name) and it will show here.</p>'; })()}</div>
      <div class="card s2"><h2>Mentor sessions and your role</h2>${D.agenda.filter(a => /mentor/i.test(a.session) && a.scTodo).map(a => `<div class="row"><span class="when">Day ${h(a.day)} · ${fmtDate(a.date)}</span><div><b>${h(a.session)}</b>${a.notes ? `<div class="sub">${h(a.notes)}</div>` : ''}${lines(a.scTodo).map(t => `<div class="sub">• ${h(t)}</div>`).join('')}</div></div>`).join('') || '<p class="empty">Mentor sessions will show here from the agenda.</p>'}</div></div>${g.html}`,
      after: g.wire },
    { id: 'agenda', label: 'Agenda and roles', render: () => `<div class="card"><h2>Agenda with committee roles</h2><p class="sub">${tzNote()} Your tasks are listed under each session.</p>${agendaHTML(C, 'scTodo')}</div>` },
    { id: 'attendance', label: 'Attendance', render: () => { const el = elapsed();
      const byUni = {}; D.attendance.forEach(s => { (byUni[s.uni || 'No university'] = byUni[s.uni || 'No university'] || []).push(s); });
      return `<div class="card" style="margin-bottom:18px"><h2>Attendance by university</h2>
        ${el ? `<p class="sub" style="margin:-4px 0 12px">Counted over the ${el} programme day${el === 1 ? '' : 's'} completed so far. Today is added once it is over.</p>` : '<p class="sub" style="margin:-4px 0 12px">Attendance will be counted from the end of Day 1.</p>'}
        <div class="wrapx"><table><thead><tr><th>University</th><th>Students</th><th>Average attendance</th><th>Missed 2 or more days</th></tr></thead><tbody>
        ${Object.keys(byUni).sort().map(u => { const L = byUni[u], att = L.reduce((n, s) => n + attended(s, el), 0), m = L.filter(s => missed(s, el) >= 2).length;
          return `<tr><td><b>${h(u)}</b></td><td>${L.length}</td><td>${el ? Math.round(att / (L.length * el) * 100) + '%' : '–'}</td><td>${m ? `<span class="st Pending">${m} student${m === 1 ? '' : 's'}</span>` : el ? '<span class="st Confirmed">None</span>' : '–'}</td></tr>`; }).join('') || '<tr><td colspan="4" class="empty">No students yet.</td></tr>'}</tbody></table></div></div>
      <div class="card"><h2>Student attendance</h2><input class="search" id="aq" type="search" placeholder="Filter by name, university or team" aria-label="Filter attendance">
        <div class="chips" id="achips" role="group" aria-label="Show"><button type="button" data-f="" aria-pressed="true">Everyone</button><button type="button" data-f="2" aria-pressed="false">Missed 2 or more days</button></div>
        <div class="wrapx"><table><thead><tr><th>Student</th><th>University</th><th>Team</th><th>Days 1 to 10</th><th>Attended</th></tr></thead><tbody id="att"></tbody></table></div></div>`; },
      after: () => { const el = elapsed(); let min = 0;
        const draw = () => { const q = ($('#aq').value || '').toLowerCase(); const rows = D.attendance.filter(s => [s.name, s.uni, s.team].join(' ').toLowerCase().includes(q) && missed(s, el) >= min);
          $('#att').innerHTML = rows.length ? rows.map(s => `<tr><td>${h(s.name)}</td><td>${h(s.uni)}</td><td>${h(s.team)}</td><td>${s.att.map((a, i) => `<span class="att ${a ? 'y' : i < el ? 'n' : ''}" title="Day ${i + 1}: ${a ? 'attended' : i < el ? 'missed' : 'not yet held'}"></span>`).join('')}</td><td>${s.att.filter(Boolean).length}${el ? ' of ' + el : ''}</td></tr>`).join('') : `<tr><td colspan="5" class="empty">${min ? 'Nobody has missed two or more days.' : 'No students match.'}</td></tr>`; };
        $('#aq').oninput = draw;
        $('#achips').onclick = e => { const b = e.target.closest('button'); if (!b) return; min = +b.dataset.f; [...$('#achips').children].forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); };
        draw(); } },
    pastPage([]),
    { id: 'updates', label: 'Updates', render: () => `<div class="card"><h2>Recent updates</h2>${D.updates.map(u => `<div class="row"><span class="time">${fmtDate(u.date)}</span><div><b>${h(u.title)}</b><div>${h(u.summary)}</div></div></div>`).join('') || '<p class="empty">No updates yet.</p>'}</div>` },
    { id: 'committee', label: 'Committee contacts', render: () => `<div class="card"><h2>Committee contacts</h2><div class="cards">${D.committee.map(p => `<div class="person"><div class="av">${h(ini(p.name))}</div><div><b>${h(p.name)}</b><div class="sub">${h([p.role, p.uni].filter(Boolean).join(', '))}</div></div></div>`).join('')}</div></div>` },
  ], 'Steering committee');
}

boot();
</script>
</body></html>
