<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SECIP 2027</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23F26B1D'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
:root{--o:#F26B1D;--o2:#FFE3D0;--o3:#FFF4EC;--bg:#FFFAF6;--line:#F6C9A8;--t:#2a2a2a;--m:#86644e;--g:#2f8f6b}
*{box-sizing:border-box}
body{margin:0;font-family:"Bricolage Grotesque",system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);line-height:1.45}
a{color:inherit}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
button{font:inherit}
[hidden]{display:none!important}
/* Sign-in */
.sitefoot{text-align:center;font-size:12px;color:var(--m);padding:14px 16px}
.sitefoot a{color:var(--o);font-weight:600}
.signin{min-height:calc(100vh - 48px);display:grid;place-items:center;padding:24px}
.signin .box{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:36px;max-width:420px;width:100%}
.signin h1{font-size:44px;margin:0 0 4px;color:var(--o);font-weight:800;letter-spacing:-.02em}
.signin p{color:var(--m);margin:0 0 22px}
.signin label{display:block;font-weight:600;margin-bottom:6px}
.signin input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px}
.signin .msg{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--o3)}
.btn{display:inline-block;background:var(--o);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.btn.wide{width:100%;margin-top:14px;padding:13px;font-size:16px}
.btn.quiet{background:none;color:var(--o);padding:6px 8px}
/* Layout */
.app{display:flex;min-height:100vh}
nav{width:224px;flex-shrink:0;background:#fff;border-right:1.5px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
nav .logo{font-weight:800;font-size:23px;color:var(--o);padding:0 10px;letter-spacing:-.01em}
nav .who{font-size:13px;color:var(--m);padding:2px 10px 24px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;margin:2px 0;cursor:pointer;font-weight:500;color:var(--t)}
nav button[aria-current="page"],nav button:hover{background:var(--o);color:#fff}
nav .out{margin-top:auto;color:var(--m);font-size:14px;padding:10px 12px;text-decoration:none}
main{flex:1;padding:30px 34px;max-width:1320px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:46px;margin:0;line-height:1;font-weight:800;letter-spacing:-.02em}
.top .meta{color:var(--m);margin-top:8px}
.pill{display:inline-block;background:var(--o);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;margin-left:8px;vertical-align:middle}
.count{background:var(--o);color:#fff;border-radius:16px;padding:12px 20px;text-align:center;min-width:130px}
.count b{display:block;font-size:34px;line-height:1}
.grid{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:18px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.card h2{margin:0 0 12px;font-size:19px;font-weight:600}
.s2{grid-column:span 2}.s3{grid-column:1/-1}.r2{grid-row:span 2}
.brief{background:var(--o3);border-color:var(--o)}.brief p{margin:8px 0}.brief strong{color:var(--o)}
.sub{font-size:13px;color:var(--m)}
.tag{display:inline-block;background:var(--o2);border-radius:20px;padding:3px 11px;margin:3px 4px 3px 0;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chips button{border:0;background:var(--o2);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--o);color:#fff}
.lnk{display:flex;flex-direction:column;gap:2px;padding:10px 12px;margin:6px 0;border-radius:10px;background:var(--o3);text-decoration:none;font-size:14px}
.lnk:hover{background:var(--o);color:#fff}.lnk span:first-child{font-weight:600}.lnk span:last-child{opacity:.75;font-size:12px}.lnk span:last-child:empty{display:none}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--o2)}
.row:last-child{border-bottom:0}
.row input[type=checkbox]{accent-color:var(--o);width:18px;height:18px;margin-top:2px;flex-shrink:0}
.when{margin-left:auto;font-size:12px;background:var(--o2);border-radius:20px;padding:2px 10px;white-space:nowrap}
.when.soon{background:var(--o);color:#fff}
.time{font-size:13px;color:var(--m);white-space:nowrap;min-width:88px}
#map{height:270px;border-radius:12px;background:var(--o3)}
.stats{display:flex;gap:10px;margin-top:10px}.stat{flex:1;background:var(--o3);border-radius:10px;padding:8px;text-align:center;font-size:12px}.stat b{display:block;font-size:22px;color:var(--o)}
.tl{display:flex;position:relative;margin-top:24px;overflow-x:auto;padding-bottom:4px}
.tl:before{content:"";position:absolute;top:7px;left:0;right:0;height:3px;background:var(--o2)}
.tl .bar{position:absolute;top:7px;left:0;height:3px;background:var(--o)}
.step{flex:1;min-width:92px;position:relative;padding-right:10px;font-size:12px}
.step .dot{width:17px;height:17px;border-radius:50%;background:#fff;border:3px solid var(--o2);position:relative;z-index:1}
.step.done .dot{background:var(--o);border-color:var(--o)}.step.now .dot{border-color:var(--o);box-shadow:0 0 0 5px var(--o2)}
.step .d{color:var(--m);margin:8px 0 2px}.step b{display:block;font-size:13px}
.av{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--o);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--o);flex-shrink:0;background:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.person{display:flex;gap:12px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.mc{background:#fff;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.mc .ph{height:160px;background:var(--o3);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:var(--o)}
.mc .ph img{width:100%;height:100%;object-fit:cover}
.mc .bd{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:6px}.mc h3{margin:0;font-size:17px}
.mc .ft{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.partners{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pl{height:76px;border:1.5px solid var(--o2);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:600;font-size:13px;color:#555;background:#fff;text-decoration:none}
.pl img{max-height:48px;max-width:100%;object-fit:contain}
input.search{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:15px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--m);font-weight:600;font-size:12px;padding:6px}
td{padding:9px 6px;border-top:1px solid var(--o2);vertical-align:top}
.wrapx{overflow-x:auto}
.st{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.st.Confirmed{background:#DFF3EA;color:var(--g)}.st.Pending{background:var(--o2);color:#b44c0f}.st.Not.started,.st.Not{background:#eee;color:#777}
.att{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--o2);margin-right:3px}.att.y{background:var(--o)}
.day h3{margin:18px 0 6px;font-size:16px}
.empty{color:var(--m);font-size:14px;padding:6px 0}
.mm .why{font-size:13px;color:var(--g);margin-top:4px}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--m)}

.pp{cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:0;overflow:hidden}
.pp:hover{border-color:var(--o)}
.pp .img{height:120px;background:var(--o3) center/cover no-repeat}
.pp .bd{padding:12px 14px 14px}
.pp p{margin:4px 0 0;font-size:13px;color:var(--m);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ppbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.ppbar select,.ppbar textarea{font:inherit;font-size:14px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--t)}
.ppbar textarea{flex:1 1 100%;min-height:64px;resize:vertical}
dialog.ppd{max-width:760px;width:calc(100% - 32px);border:0;border-radius:20px;padding:26px;background:var(--bg);color:var(--t)}
dialog.ppd::backdrop{background:rgba(0,0,0,.45)}
dialog.ppd h3{margin:16px 0 4px;font-size:15px}
@media(max-width:1000px){
 .app{flex-direction:column}
 nav{width:auto;height:auto;position:sticky;top:0;z-index:1000;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;padding:10px}
 nav .who{display:none}nav .logo{padding:0 8px 0 4px}
 nav button{width:auto;padding:8px 10px;font-size:14px}nav .out{margin:0 0 0 auto}
 main{padding:18px}
 .grid{grid-template-columns:1fr}.s2,.s3{grid-column:auto}.r2{grid-row:auto}
 .partners{grid-template-columns:repeat(2,1fr)}
 .top h1{font-size:34px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<div class="loading" id="loading">Loading your dashboard…</div>

<section class="signin" id="signin" hidden>
 <form class="box" id="signinForm">
  <h1>SECIP 2027</h1>
  <p>Sign in with the email address your university registered for you.</p>
  <label for="email">Email address</label>
  <input id="email" type="email" autocomplete="email" required placeholder="you@university.edu">
  <button class="btn wide" type="submit">Email me a sign-in link</button>
  <div class="msg" id="signinMsg" role="status" hidden></div>
 </form>
</section>

<div class="app" id="app" hidden>
 <nav id="nav" aria-label="Dashboard sections"></nav>
 <main id="main"></main>
</div>

<footer class="sitefoot">This site is powered by <a href="https://www.netlify.com" target="_blank" rel="noopener">Netlify</a></footer>

<script>
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? h(u) : '#';
const ini = n => String(n || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const lines = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
const todayISO = () => new Date().toLocaleDateString('en-CA');
const fmtDate = (d, o = { day: 'numeric', month: 'short' }) => d ? new Date(d.length === 10 ? d + 'T00:00' : d).toLocaleDateString('en-GB', o) : '';
const ist = d => new Date(d).toLocaleTimeString('en-GB', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit' });
const local = d => new Date(d).toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit' });
const sameZone = () => Intl.DateTimeFormat().resolvedOptions().timeZone === 'Asia/Kolkata';
const timeLabel = a => a.start ? `${ist(a.start)} IST${sameZone() ? '' : ` · ${local(a.start)} your time`}` : '';
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// ---------- sign-in ----------
const params = new URLSearchParams(location.search);
$('#signinForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button'), msg = $('#signinMsg');
  btn.disabled = true; btn.textContent = 'Sending…';
  try { await fetch('/api/request-link', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('#email').value }) }); } catch {}
  msg.hidden = false;
  msg.textContent = 'If that address is registered for SECIP 2027, a sign-in link is on its way. It works for 15 minutes, so check your inbox (and spam) now.';
  btn.disabled = false; btn.textContent = 'Email me a sign-in link';
});

async function boot() {
  let r;
  try { r = await fetch('/api/me', { credentials: 'same-origin' }); } catch { r = null; }
  $('#loading').hidden = true;
  if (!r || r.status === 401) {
    $('#signin').hidden = false;
    if (params.get('signin') === 'expired') { const m = $('#signinMsg'); m.hidden = false; m.textContent = 'That sign-in link has expired or was already replaced. Enter your email to get a new one.'; }
    history.replaceState(null, '', '/');
    return;
  }
  if (!r.ok) { document.body.innerHTML = '<div class="loading">The dashboard could not load its data. Refresh in a minute, or contact the SECIP team if it keeps happening.</div>'; return; }
  const D = await r.json();
  $('#app').hidden = false;
  D.role === 'sc' ? committeeApp(D) : studentApp(D);
}

// ---------- programme calendar from the agenda ----------
function calendar(agenda) {
  const dates = [...new Set(agenda.map(a => a.date))].sort();
  const t = todayISO();
  let idx = dates.indexOf(t);
  const before = dates.length && t < dates[0], after = dates.length && t > dates[dates.length - 1];
  if (idx < 0 && !before && !after) idx = dates.findIndex(d => d > t); // a weekend inside the programme: show next day
  const cur = before ? 0 : after ? dates.length - 1 : Math.max(idx, 0);
  const phaseOf = d => {
    const counts = {};
    agenda.filter(a => a.date === d && a.phase && !['Orientation', 'Reflection'].includes(a.phase)).forEach(a => counts[a.phase] = (counts[a.phase] || 0) + 1);
    return Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || 'Orientation';
  };
  const headline = d => agenda.filter(a => a.date === d && !/opening brief|break|reflection/i.test(a.session))[0]?.session || '';
  const daysToGo = before ? Math.ceil((new Date(dates[0] + 'T00:00') - new Date(t + 'T00:00')) / 864e5) : 0;
  return { dates, cur, before, after, phaseOf, headline, daysToGo, today: dates[cur], sessions: d => agenda.filter(a => a.date === d) };
}

function timeline(C) {
  if (!C.dates.length) return '<p class="empty">The agenda will appear here once it is added in Airtable.</p>';
  const pos = C.before ? -1 : C.after ? C.dates.length : C.cur;
  const w = pos < 0 ? 0 : Math.min(100, pos / (C.dates.length - 1) * 100);
  return `<div class="tl"><div class="bar" style="width:${w}%"></div>${C.dates.map((d, i) =>
    `<div class="step ${i < pos ? 'done' : i === pos ? 'now' : ''}"><div class="dot"></div><div class="d">Day ${i + 1} · ${fmtDate(d)}</div><b>${h(C.phaseOf(d))}</b>${h(C.headline(d))}</div>`).join('')}</div>`;
}

// ---------- shared blocks ----------
const linksHTML = L => L.length ? L.map(l => `<a class="lnk" href="${safeUrl(l.url)}" target="_blank" rel="noopener"><span>${h(l.name)}</span><span>${h(l.note || (l.due ? fmtDate(l.due) : ''))}</span></a>`).join('') : '<p class="empty">Links will appear here soon.</p>';
const partnersHTML = P => `<div class="partners">${P.map(p => { const inner = p.logo ? `<img src="${safeUrl(p.logo)}" alt="${h(p.name)}">` : h(p.name); return p.url ? `<a class="pl" href="${safeUrl(p.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="pl">${inner}</div>`; }).join('')}</div>`;

function mentorCard(m, showStatus) {
  return `<article class="mc"><div class="ph">${m.photo ? `<img src="${safeUrl(m.photo)}" alt="" loading="lazy">` : h(ini(m.name))}</div>
   <div class="bd"><h3>${h(m.name)}</h3>
   ${m.role || m.org ? `<div class="sub">${h([m.role, m.org].filter(Boolean).join(', '))}</div>` : ''}
   ${m.sessions.length ? `<div class="sub">${h(m.sessions.join(' and '))}</div>` : m.type ? `<div class="sub">${h(m.type)}</div>` : ''}
   <div>${m.expertise.map(x => `<span class="tag">${h(x)}</span>`).join('')}</div>
   ${m.bio ? `<div class="sub">${h(m.bio)}</div>` : ''}
   <div class="ft">${m.linkedin ? `<a class="btn" href="${safeUrl(m.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : '<span class="sub">Profile coming soon</span>'}
   ${showStatus ? `<span class="st ${m.confirmed ? 'Confirmed' : 'Pending'}">${m.confirmed ? 'Confirmed' : 'To confirm'}</span>` : ''}</div></div></article>`;
}

function mentorGallery(D, showStatus) {
  const tags = ['All', ...new Set(D.mentors.flatMap(m => m.expertise))];
  return { html: `<div class="card" style="margin-bottom:18px"><h2>Mentor gallery</h2>
    <p class="sub" style="margin:0 0 12px">Mentors join on Day 6 for expert sessions and on Day 8 for alumni mentoring and the mentor review. Each mentor works with two or three teams.</p>
    <input class="search" id="mq" type="search" placeholder="Search by name or expertise" aria-label="Search mentors">
    <div class="chips" id="mchips">${tags.map((t, i) => `<button type="button" aria-pressed="${!i}" data-t="${h(t)}">${h(t)}</button>`).join('')}</div></div>
    <div class="cards" id="mg"></div>`,
    wire() {
      let tag = 'All';
      const draw = () => { const q = ($('#mq').value || '').toLowerCase();
        const list = D.mentors.filter(m => (tag === 'All' || m.expertise.includes(tag)) && (m.name + ' ' + m.expertise.join(' ') + ' ' + m.org).toLowerCase().includes(q));
        $('#mg').innerHTML = list.length ? list.map(m => mentorCard(m, showStatus)).join('') : '<p class="empty">No mentors match that search.</p>'; };
      $('#mq').oninput = draw;
      $('#mchips').onclick = e => { const b = e.target.closest('button'); if (!b) return; tag = b.dataset.t; [...$('#mchips').children].forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); };
      draw();
    } };
}

function agendaHTML(C, field) {
  if (!C.dates.length) return '<p class="empty">The agenda will appear here once it is added in Airtable.</p>';
  return C.dates.map((d, i) => `<div class="day"><h3>Day ${i + 1}, ${fmtDate(d, { weekday: 'long', day: 'numeric', month: 'long' })}</h3>${C.sessions(d).map(a =>
    `<div class="row"><span class="time">${h(ist(a.start))}</span><div><b>${h(a.session)}</b>${a.facilitator ? `<div class="sub">${h(a.facilitator)}${a.format ? ', ' + h(a.format.toLowerCase()) : ''}</div>` : ''}
    ${lines(a[field]).map(t => `<div class="sub">• ${h(t)}</div>`).join('')}
    ${[a.slides && `<a href="${safeUrl(a.slides)}" target="_blank" rel="noopener">Slides</a>`, a.recording && `<a href="${safeUrl(a.recording)}" target="_blank" rel="noopener">Recording</a>`].filter(Boolean).join(' · ')}</div></div>`).join('')}</div>`).join('');
}

function drawMap(D, el) {
  const byUni = {};
  D.students.forEach(s => { (byUni[s.uni] = byUni[s.uni] || []).push(s); });
  const unis = D.universities.filter(u => typeof u.lat === 'number' && typeof u.lng === 'number');
  const map = L.map(el, { scrollWheelZoom: false, attributionControl: false, zoomSnap: .5 }).setView([8, 115], 2.5);
  const pins = L.featureGroup().addTo(map);
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r => r.json()).then(w => {
    L.geoJSON(topojson.feature(w, w.objects.countries), { style: { color: '#F6C9A8', weight: .8, fillColor: '#fff', fillOpacity: 1 }, interactive: false }).addTo(map);
    pins.eachLayer(l => l.bringToFront());
  }).catch(() => {});
  unis.forEach(u => { const n = (byUni[u.name] || []).length;
    L.circleMarker([u.lat, u.lng], { radius: 7 + Math.min(n, 30) * .8, color: '#F26B1D', fillColor: '#F26B1D', fillOpacity: .6, weight: 2 })
      .addTo(pins).bindPopup(`<b>${h(u.name)}</b><br>${n} student${n === 1 ? '' : 's'}`); });
  setTimeout(() => map.invalidateSize(), 60);
  return map;
}
const mapStats = D => { const c = new Set(D.universities.map(u => u.country).filter(Boolean)); return `<div class="stats"><div class="stat"><b>${D.students.length}</b>Students</div><div class="stat"><b>${c.size}</b>Countries</div><div class="stat"><b>${D.universities.length}</b>Universities</div></div>`; };

// ---------- navigation ----------
function shell(D, pages, title) {
  $('#nav').innerHTML = `<div class="logo">SECIP 2027</div><div class="who">${h(title)}</div>${pages.map(p => `<button type="button" data-p="${p.id}">${h(p.label)}</button>`).join('')}<a class="out" href="/api/logout">Sign out</a>`;
  let map;
  const show = id => {
    const p = pages.find(x => x.id === id) || pages[0];
    $('#nav').querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.p === p.id ? 'page' : 'false'));
    $('#main').innerHTML = p.render();
    if (p.after) map = p.after() || map;
    window.scrollTo(0, 0);
    if (location.hash !== '#' + p.id) history.replaceState(null, '', '#' + p.id);
  };
  $('#nav').onclick = e => { const b = e.target.closest('button[data-p]'); if (b) show(b.dataset.p); };
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
}

// ---------- past projects ----------
let PAST = null;
const loadPast = () => PAST || (PAST = fetch('/api/past-projects', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : { projects: [] }).then(j => j.projects || []).catch(() => []));
const STOP = new Set('the a an and or of to in for on with by at from is are be how might we can our their they them this that these those as it its into without who what which help people more less young local'.split(' '));
const words = t => String(t || '').toLowerCase().match(/[a-z]{4,}/g)?.filter(w => !STOP.has(w)).map(w => w.replace(/(ing|ers|ies|es|s)$/, '')) || [];
const sdgOf = list => [...new Set((list || []).flatMap(x => String(x).match(/\b(1[0-7]|[1-9])\b/g) || []).map(Number))];
function rankPast(P, idea, sdgs) {
  const q = new Set(words(idea));
  return P.map(p => { const w = new Set(words(p.name + ' ' + p.problem + ' ' + p.solution));
      let shared = 0; q.forEach(x => { if (w.has(x)) shared++; });
      const sdgHit = p.sdgNums.filter(n => sdgs.includes(n)).length;
      return { p, score: shared * 2 + sdgHit * 3 + (q.size ? 0 : Math.random() * .01), shared, sdgHit }; })
    .filter(x => x.score > 0.5).sort((a, b) => b.score - a.score);
}
const pastCard = p => `<button type="button" class="pp" data-pp="${h(p.id)}"><div class="img" style="${p.image ? `background-image:url('${safeUrl(p.image)}')` : ''}"></div><div class="bd"><b>${h(p.name)}</b><div class="sub">${h(p.cohort)}${p.sdg ? ' · ' + h(p.sdg.split(',')[0]) : ''}</div><p>${h(p.problem || p.solution)}</p></div></button>`;
function openPast(p) {
  let d = $('#ppd'); if (!d) { d = document.createElement('dialog'); d.id = 'ppd'; d.className = 'ppd'; document.body.appendChild(d); }
  const fl = L => L.map(a => `<a class="lnk" href="${safeUrl(a.url)}" target="_blank" rel="noopener"><span>${h(a.name)}</span><span></span></a>`).join('');
  d.innerHTML = `<div style="display:flex;justify-content:space-between;gap:12px"><div><h2 style="margin:0">${h(p.name)}</h2><div class="sub">${h([p.cohort, p.team].filter(Boolean).join(' · '))}</div></div><button class="btn quiet" type="button" onclick="this.closest('dialog').close()" aria-label="Close">Close</button></div>
    ${p.sdg ? `<div style="margin-top:8px">${p.sdg.split(',').map(t => `<span class="tag">${h(t.trim())}</span>`).join('')}</div>` : ''}
    ${p.problem ? `<h3>Problem</h3><p style="white-space:pre-line;margin:0">${h(p.problem)}</p>` : ''}
    ${p.solution ? `<h3>Solution</h3><p style="white-space:pre-line;margin:0">${h(p.solution)}</p>` : ''}
    ${p.members.length ? `<h3>Team</h3><p style="margin:0">${h(p.members.join(', '))}</p>` : ''}
    ${p.deck.length ? `<h3>Pitch deck</h3>${fl(p.deck)}` : ''}${p.files.length ? `<h3>Other files</h3>${fl(p.files)}` : ''}`;
  d.showModal();
}
const wirePastClicks = (root, P) => root.querySelectorAll('[data-pp]').forEach(b => b.onclick = () => openPast(P.find(p => p.id === b.dataset.pp)));
function pastPage(mySdg) {
  return { id: 'past', label: 'Past projects', render: () => `<div class="card"><h2>Past projects</h2>
      <p class="sub" style="margin:-4px 0 14px">Every team that pitched at a previous SECIP open house. Describe your problem or idea to find projects like yours, then learn from what they tried.</p>
      <div class="ppbar"><textarea id="ppq" placeholder="Paste your team's problem statement or idea, e.g. food waste in city households" aria-label="Describe your problem or idea"></textarea>
        <select id="pps" aria-label="Filter by goal"><option value="">All goals</option>${[...Array(17)].map((_, i) => `<option value="${i + 1}">SDG ${i + 1}</option>`).join('')}</select>

    after: () => { loadPast().then(P => {

      $('#ppc').innerHTML += [...new Set(P.map(p => p.cohort))].map(c => `<option>${h(c)}</option>`).join('');
      const draw = () => { const q = $('#ppq').value.trim(), sg = +$('#pps').value, co = $('#ppc').value;
        let L = P.filter(p => (!sg || p.sdgNums.includes(sg)) && (!co || p.cohort === co));

        $('#ppl').innerHTML = L.length ? L.map(pastCard).join('') : `<p class="empty">${P.length ? 'No past projects match yet. Try different words.' : 'Past projects will appear here once they are connected.'}</p>`;

// ---------- matchmaker ----------
// Suggests students outside your own team who share your SDG interests,
// nudging towards other universities and countries. Uses only data already in the directory.
function matchmaker(D, me) {
  const mine = new Set(me.sdg);
  return D.students.filter(s => s.name !== me.name && !(me.team && s.team === me.team))
    .map(s => { const shared = s.sdg.filter(x => mine.has(x));
      return { s, shared, score: shared.length * 3 + (s.uni && s.uni !== me.uni ? 1 : 0) + (s.country && s.country !== me.country ? 1 : 0) }; })
    .filter(x => x.shared.length)
    .sort((a, b) => b.score - a.score || a.s.name.localeCompare(b.s.name));
}
const matchCard = (x, me) => `<div class="card person mm"><div class="av">${h(ini(x.s.name))}</div><div><b>${h(x.s.name)}</b>
  <div class="sub">${h([x.s.uni, x.s.country].filter(Boolean).join(', '))}</div>
  <div class="why">Also cares about ${h(x.shared.slice(0, 2).join(' and '))}${x.shared.length > 2 ? ` +${x.shared.length - 2}` : ''}</div></div></div>`;
const matchEmpty = me => me.sdg.length ? '<p class="empty">No matches yet. More people will appear as universities send in their student lists.</p>'
  : '<p class="empty">Choose your SDG interests in the team survey and we’ll suggest people who share them.</p>';

        $('#aq').oninput = draw; draw(); } },
    pastPage([]),
    { id: 'updates', label: 'Updates', render: () => `<div class="card"><h2>Recent updates</h2>${D.updates.map(u => `<div class="row"><span class="time">${fmtDate(u.date)}</span><div><b>${h(u.title)}</b><div>${h(u.summary)}</div></div></div>`).join('') || '<p class="empty">No updates yet.</p>'}</div>` },
    { id: 'committee', label: 'Committee contacts', render: () => `<div class="card"><h2>Committee contacts</h2><div class="cards">${D.committee.map(p => `<div class="person"><div class="av">${h(ini(p.name))}</div><div><b>${h(p.name)}</b><div class="sub">${h([p.role, p.uni].filter(Boolean).join(', '))}</div></div></div>`).join('')}</div></div>` },
  ], 'Steering committee');
}

boot();
</script>
</body></html>
